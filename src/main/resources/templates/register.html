<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroLuxe - Create Your Account</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes cloudDrift {
      0% { transform: translateX(110%); }
      100% { transform: translateX(-140%); }
    }
    .cloud-drift-1 { animation: cloudDrift 22s linear infinite; }
    .cloud-drift-2 { animation: cloudDrift 30s linear infinite; animation-delay: -8s; }
    .cloud-drift-3 { animation: cloudDrift 18s linear infinite; animation-delay: -14s; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 antialiased min-h-screen selection:bg-sky-500 selection:text-white relative overflow-x-hidden">

  <!-- Background Drifting Clouds Animation -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute top-[12%] w-64 h-20 bg-white/[0.03] rounded-full blur-xl cloud-drift-1"></div>
    <div class="absolute top-[45%] w-80 h-16 bg-white/[0.02] rounded-full blur-2xl cloud-drift-2"></div>
    <div class="absolute top-[75%] w-48 h-12 bg-sky-500/[0.03] rounded-full blur-xl cloud-drift-3"></div>
  </div>

  <div class="relative z-10 min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg space-y-6">

      <!-- AeroLuxe Branding -->
      <div class="text-center space-y-3">
        <div class="mx-auto w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-500 via-indigo-600 to-blue-500 text-white flex items-center justify-center font-black text-2xl shadow-xl shadow-sky-500/30">
          ✈
        </div>
        <div>
          <div class="flex items-center justify-center gap-2 mb-0.5">
            <span class="text-xl font-black tracking-wider text-white uppercase">AeroLuxe</span>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-400 font-bold uppercase tracking-wider border border-sky-500/30">Skyfleet 2.0</span>
          </div>
          <span class="text-[11px] text-slate-400 block tracking-widest font-mono">PASSENGER REGISTRATION</span>
        </div>
      </div>

      <!-- Registration Card -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-sm space-y-5">
        
        <div class="text-center space-y-1">
          <h1 class="text-2xl font-black text-white tracking-tight">Create Passenger Profile</h1>
          <p class="text-xs text-slate-400">Join AeroLuxe for instant boarding passes and seat reservations</p>
        </div>

        <!-- Inline Error Banner -->
        <div id="errorAlert" class="hidden p-3 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs font-bold text-center">
        </div>

        <!-- Inline Success Banner -->
        <div id="successAlert" class="hidden p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold text-center">
        </div>

        <!-- Registration Form -->
        <form id="regForm" onsubmit="handleRegister(event)" class="space-y-4">
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            <div class="space-y-1">
              <label class="text-[11px] font-bold text-slate-400 uppercase block tracking-wider">Full Name</label>
              <input type="text" id="fullName" required placeholder="Malhar Sarwate"
                     class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm font-bold placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/50 transition"/>
            </div>

            <div class="space-y-1">
              <label class="text-[11px] font-bold text-slate-400 uppercase block tracking-wider">Email Address</label>
              <input type="email" id="email" required placeholder="malhar@example.com"
                     class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm font-bold placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/50 transition"/>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            <div class="space-y-1">
              <label class="text-[11px] font-bold text-slate-400 uppercase block tracking-wider">Password</label>
              <input type="password" id="password" required placeholder="••••••••"
                     class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm font-bold placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/50 transition"/>
            </div>

            <div class="space-y-1">
              <label class="text-[11px] font-bold text-slate-400 uppercase block tracking-wider">Confirm Password</label>
              <input type="password" id="confirmPassword" required placeholder="••••••••"
                     class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm font-bold placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/50 transition"/>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
            <div class="space-y-1">
              <label class="text-[11px] font-bold text-slate-400 uppercase block tracking-wider">Passport / ID Number</label>
              <input type="text" id="passportNumber" placeholder="P94821037"
                     class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm font-bold placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/50 transition"/>
            </div>

            <div class="space-y-1">
              <label class="text-[11px] font-bold text-slate-400 uppercase block tracking-wider">Phone Number</label>
              <input type="tel" id="phone" placeholder="+1 (555) 019-2834"
                     class="w-full px-3.5 py-2.5 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm font-bold placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/50 transition"/>
            </div>
          </div>

          <button type="submit" id="submitBtn"
                  class="w-full py-3.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 hover:opacity-95 text-white font-black text-sm shadow-lg shadow-sky-500/20 active:scale-[0.98] transition flex items-center justify-center gap-2 mt-2">
            <span>Complete Registration</span>
            <span>✈</span>
          </button>
        </form>

        <!-- Login Link -->
        <div class="text-center pt-2 border-t border-slate-800">
          <span class="text-xs text-slate-400">Already have an AeroLuxe account?</span>
          <a th:href="@{/login}" href="login.html" class="text-xs text-sky-400 font-bold hover:underline ml-1">
            Sign In Here →
          </a>
        </div>
      </div>

      <!-- Footer -->
      <p class="text-center text-[10px] text-slate-500 font-mono tracking-wider">
        © 2026 AEROLUXE SKYFLEET • ENCRYPTED DATA PROTECTION
      </p>
    </div>
  </div>

  <script>
    async function handleRegister(event) {
      event.preventDefault();
      const err = document.getElementById('errorAlert');
      const succ = document.getElementById('successAlert');
      const btn = document.getElementById('submitBtn');
      
      err.classList.add('hidden');
      succ.classList.add('hidden');

      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        err.textContent = '✕ Passwords do not match. Please verify.';
        err.classList.remove('hidden');
        return;
      }

      const reqBody = {
        fullName: document.getElementById('fullName').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: password,
        confirmPassword: confirmPassword,
        passportNumber: document.getElementById('passportNumber').value.trim(),
        phone: document.getElementById('phone').value.trim()
      };

      btn.disabled = true;
      btn.innerHTML = '<span>Creating Account...</span>';

      if (window.location.protocol === 'file:') {
        succ.textContent = '✓ Profile created! Redirecting to login...';
        succ.classList.remove('hidden');
        setTimeout(() => {
          window.location.href = 'login.html?registered=true';
        }, 800);
        return;
      }

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(reqBody)
        });

        const data = await res.json();

        if (res.ok && data.success) {
          succ.textContent = '✓ Account registered successfully! Redirecting to login...';
          succ.classList.remove('hidden');
          setTimeout(() => {
            window.location.href = '/login?registered=true';
          }, 1000);
        } else {
          err.textContent = '✕ ' + (data.message || 'Registration failed. Please try again.');
          err.classList.remove('hidden');
          btn.disabled = false;
          btn.innerHTML = '<span>Complete Registration</span><span>✈</span>';
        }
      } catch (e) {
        err.textContent = '✕ Network error while connecting to AeroLuxe server.';
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>Complete Registration</span><span>✈</span>';
      }
    }
  </script>

</body>
</html>
