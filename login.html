<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AeroLuxe - Welcome Back</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes cloudDrift {
      0% { transform: translateX(110%); }
      100% { transform: translateX(-140%); }
    }
    .cloud-drift-1 { animation: cloudDrift 22s linear infinite; }
    .cloud-drift-2 { animation: cloudDrift 30s linear infinite; animation-delay: -8s; }
    .cloud-drift-3 { animation: cloudDrift 18s linear infinite; animation-delay: -14s; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 9999px; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 antialiased min-h-screen selection:bg-sky-500 selection:text-white relative overflow-x-hidden">

  <!-- Background Drifting Clouds Animation -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute top-[15%] w-64 h-20 bg-white/[0.03] rounded-full blur-xl cloud-drift-1"></div>
    <div class="absolute top-[40%] w-80 h-16 bg-white/[0.02] rounded-full blur-2xl cloud-drift-2"></div>
    <div class="absolute top-[70%] w-48 h-12 bg-sky-500/[0.03] rounded-full blur-xl cloud-drift-3"></div>
  </div>

  <div class="relative z-10 min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md space-y-8">

      <!-- AeroLuxe Branding -->
      <div class="text-center space-y-4">
        <div class="mx-auto w-16 h-16 rounded-2xl bg-gradient-to-tr from-sky-500 via-indigo-600 to-blue-500 text-white flex items-center justify-center font-black text-3xl shadow-xl shadow-sky-500/30">
          ✈
        </div>
        <div>
          <div class="flex items-center justify-center gap-2 mb-1">
            <span class="text-xl font-black tracking-wider text-white uppercase">AeroLuxe</span>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-400 font-bold uppercase tracking-wider border border-sky-500/30">Skyfleet 2.0</span>
          </div>
          <span class="text-[11px] text-slate-400 block tracking-widest font-mono">ENJOYABLE 2D RESERVATION</span>
        </div>
      </div>

      <!-- Login Card -->
      <div class="bg-slate-900/80 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-sm space-y-6">
        
        <div class="text-center space-y-2">
          <h1 class="text-2xl font-black text-white tracking-tight">Welcome Back, Traveler</h1>
          <p class="text-sm text-slate-400">Sign in to access your AeroLuxe flight dashboard</p>
        </div>

        <!-- Inline Status Message -->
        <div id="statusMsg" class="hidden p-3 rounded-xl text-xs font-bold text-center"></div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
          
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-400 uppercase block tracking-wider">Email Address</label>
            <input type="email" id="email" value="admin@aeroluxe.com" required placeholder="captain@aeroluxe.com"
                   class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm font-bold placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/50 transition"/>
          </div>

          <div class="space-y-1.5">
            <label class="text-[11px] font-bold text-slate-400 uppercase block tracking-wider">Password</label>
            <input type="password" id="password" value="admin123" required placeholder="••••••••"
                   class="w-full px-4 py-3 rounded-xl bg-slate-950 border border-slate-800 text-white text-sm font-bold placeholder-slate-600 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500/50 transition"/>
          </div>

          <button type="submit"
                  class="w-full py-3.5 rounded-xl bg-gradient-to-r from-sky-500 to-blue-600 hover:opacity-95 text-white font-black text-sm shadow-lg shadow-sky-500/20 active:scale-[0.98] transition flex items-center justify-center gap-2">
            <span>Sign In to Dashboard</span>
            <span>→</span>
          </button>
        </form>

        <!-- Register Link -->
        <div class="text-center pt-2 border-t border-slate-800">
          <span class="text-xs text-slate-400">New to AeroLuxe?</span>
          <a href="register.html" class="text-xs text-sky-400 font-bold hover:underline ml-1">
            Create an Account →
          </a>
        </div>
      </div>

      <!-- Quick Demo Access Note -->
      <div class="p-3.5 rounded-2xl bg-slate-900/60 border border-slate-800/80 text-center text-xs text-slate-400">
        <span class="font-bold text-emerald-400">💡 Demo Credentials:</span> admin@aeroluxe.com / admin123
      </div>

      <!-- Footer -->
      <p class="text-center text-[10px] text-slate-500 font-mono tracking-wider">
        © 2026 AEROLUXE SKYFLEET • SECURE PASSENGER PORTAL
      </p>
    </div>
  </div>

  <script>
    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const pass = document.getElementById('password').value;
      const msg = document.getElementById('statusMsg');

      let userName = 'Malhar Sarwate';
      const stored = localStorage.getItem('aeroluxe_registered_user');
      if (stored) {
        try {
          const u = JSON.parse(stored);
          if (u.email === email) userName = u.fullName;
        } catch(e) {}
      }

      localStorage.setItem('aeroluxe_active_user', JSON.stringify({
        fullName: userName,
        email: email,
        passportNumber: 'P94821037'
      }));

      msg.className = 'p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold text-center block';
      msg.textContent = '✓ Welcome back, ' + userName + '! Launching flight dashboard...';

      setTimeout(() => {
        window.location.href = 'index.html';
      }, 600);
    }

    // Check query params for logout or registered
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const msg = document.getElementById('statusMsg');
      if (params.get('logout')) {
        localStorage.removeItem('aeroluxe_active_user');
        msg.className = 'p-3 rounded-xl bg-sky-500/10 border border-sky-500/30 text-sky-400 text-xs font-bold text-center block';
        msg.textContent = '✓ You have successfully logged out.';
      } else if (params.get('registered')) {
        msg.className = 'p-3 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-xs font-bold text-center block';
        msg.textContent = '✓ Registration successful! Sign in below to continue.';
      }
    });
  </script>

</body>
</html>
